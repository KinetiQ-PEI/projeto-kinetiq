persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Desenvolvimento: sem autenticação em todos os listeners
# (os ESP32 do Mobile HeartBox ligam-se sem utilizador/password)
allow_anonymous true

# MQTT (hardware e simulador)
listener 1883 0.0.0.0

# MQTT sobre TLS. Certificados gerados pelo serviço mosquitto-certs (infra/mosquitto/certs/)
listener 8883 0.0.0.0
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

# MQTT sobre WebSockets (frontend / debug no browser)
listener 9001 0.0.0.0
protocol websockets
