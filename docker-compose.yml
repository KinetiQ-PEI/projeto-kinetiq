name: kinetiq

# Ambiente base: infraestrutura partilhada pelos serviços Spring Boot.
# Os serviços da aplicação (Telemetry Processing, Core API, Gateway, ...) ligam-se
# pelos nomes internos: kafka:29092, mosquitto:1883, postgres:5432, influxdb:8086, keycloak:8080

services:
  # ---------- Real-Time Path ----------

  # Gera a CA e o certificado do listener TLS (8883) em infra/mosquitto/certs/ (corre e termina)
  mosquitto-certs:
    image: alpine/openssl:3.5.9
    entrypoint: ["/bin/sh", "/generate-certs.sh"]
    environment:
      # IPs/nomes extra no certificado, ex.: IP:192.168.1.50 (para validar o TLS a partir de outra máquina)
      MQTT_TLS_EXTRA_SAN: ${MQTT_TLS_EXTRA_SAN:-}
    volumes:
      - ./infra/mosquitto/generate-certs.sh:/generate-certs.sh:ro
      - ./infra/mosquitto/certs:/certs
    restart: "no"

  # Broker MQTT: recebe a telemetria dos ESP32 / simuladores
  #   1883 MQTT | 8883 MQTT sobre TLS | 9001 MQTT sobre WebSockets
  mosquitto:
    image: eclipse-mosquitto:2
    depends_on:
      mosquitto-certs:
        condition: service_completed_successfully
    ports:
      - "1883:1883"
      - "8883:8883"
      - "9001:9001"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mosquitto/certs:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Frota fictícia: docker compose up -d --build simulator
  simulator:
    build: ./simulator
    profiles: [simulation]
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - SIM_BIKE_COUNT=${SIM_BIKE_COUNT:-5}
      - SIM_INTERVAL_SECONDS=${SIM_INTERVAL_SECONDS:-2}
      - MQTT_TIMEOUT_SECONDS=${MQTT_TIMEOUT_SECONDS:-10}
      # Omitidas quando não definidas: o script usa os seus valores por omissão.
      - MQTT_TOPIC_TEMPLATE
      - MQTT_USERNAME
      - MQTT_PASSWORD
      - SIM_BIKE_YEAR
      - SIM_SEED
    restart: unless-stopped
    stop_grace_period: 15s

  # Kafka em modo KRaft (sem Zookeeper)
  #   - dentro da rede docker: kafka:29092
  #   - a partir do host:      localhost:9092
  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Cria os tópicos do projeto (corre uma vez e termina)
  #   telemetry.device.raw        payload tal como chegou por MQTT (chave = tópico MQTT)
  #   telemetry.device.processed  telemetria validada/normalizada pelo Telemetry Processing Service
  #   telemetry.device.dlq        mensagens que o processamento rejeitou (guardadas 30 dias)
  # A DLQ tem tantas partições como o raw: o DeadLetterPublishingRecoverer do Spring Kafka
  # envia para a mesma partição da mensagem original.
  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        create_topic() {
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
            --topic "$$1" --partitions 3 --replication-factor 1 --config retention.ms="$$2"
        }
        create_topic telemetry.device.raw       604800000
        create_topic telemetry.device.processed 604800000
        create_topic telemetry.device.dlq       2592000000
        create_topic fleet.alerts               604800000
    restart: "no"

  # Kafka Connect com os plugins MQTT Source, JDBC Sink e InfluxDB Sink
  # REST API: http://localhost:8083 (os connectors são registados pelo kafka-connect-init)
  kafka-connect:
    build: ./infra/kafka-connect
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:29092
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_GROUP_ID: kinetiq-connect
      CONNECT_CONFIG_STORAGE_TOPIC: connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # Regista/atualiza os connectors de infra/kafka-connect/connectors/ (corre uma vez e termina)
  # Depois de editar um JSON, ou se um connector estiver FAILED: docker compose up kafka-connect-init
  # Espera pelo Mosquitto: se a task MQTT arrancar com o broker em baixo, fica FAILED
  kafka-connect-init:
    image: curlimages/curl:8.17.0
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      kafka-connect:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/register-connectors.sh"]
    volumes:
      - ./infra/kafka-connect/register-connectors.sh:/register-connectors.sh:ro
      - ./infra/kafka-connect/connectors:/connectors:ro
    restart: "no"

  # UI web para inspecionar tópicos, mensagens e connectors: http://localhost:8089
  kafka-ui:
    image: kafbat/kafka-ui:v1.3.0
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8089:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: kinetiq
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
    restart: unless-stopped

  # ---------- Data Layer ----------

  # Séries temporais da telemetria
  influxdb:
    image: influxdb:2.7
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USER:-kinetiq}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:-kinetiq123}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-kinetiq}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-telemetry}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-kinetiq-dev-token}
    volumes:
      - influxdb-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Dados operacionais (frota, zonas, eventos) com PostGIS + BD do Keycloak
  postgres:
    image: postgis/postgis:17-3.5
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kinetiq}
      POSTGRES_USER: ${POSTGRES_USER:-kinetiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kinetiq}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # só o ficheiro: montar a pasta escondia o 10_postgis.sh da imagem
      - ./infra/postgres/init/20-keycloak.sql:/docker-entrypoint-initdb.d/20-keycloak.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------- Operational Path ----------

  # Authentication Service: http://localhost:8180 (consola de admin)
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: start-dev
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8180:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-kinetiq}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-kinetiq}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      # Tokens emitidos com issuer http://localhost:8180; os serviços internos usam keycloak:8080
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

volumes:
  mosquitto-data:
  kafka-data:
  influxdb-data:
  postgres-data:
